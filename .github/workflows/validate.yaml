name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily on main: catches breakage from new Home Assistant / HACS requirements.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS / Marketplace validation
        uses: hacs/action@main
        with:
          category: integration
      - name: hassfest
        uses: home-assistant/actions/hassfest@master
