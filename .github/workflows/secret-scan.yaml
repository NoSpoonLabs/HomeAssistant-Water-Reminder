name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    # gitleaks and a check for absolute local paths on the new commits (kept inline on purpose).
    runs-on: ubuntu-latest
    env:
      # Pull request: its commits. Push: the pushed commits. Manual run: full history.
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine commit range
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit, scanning the full history."
            echo "LOG_RANGE=$HEAD" >> "$GITHUB_ENV"
            echo "DIFF_BASE=$(git hash-object -t tree /dev/null)" >> "$GITHUB_ENV"
          else
            echo "LOG_RANGE=$BASE..$HEAD" >> "$GITHUB_ENV"
            echo "DIFF_BASE=$(git merge-base "$BASE" "$HEAD")" >> "$GITHUB_ENV"
          fi

      - name: gitleaks (new commits)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose --log-opts "$LOG_RANGE"

      - name: Absolute local paths (added lines)
        run: |
          # Prints «file:line: text» for every added line that holds an absolute local path.
          found=$(git diff --no-color -U0 "$DIFF_BASE" "$HEAD" | awk '
            /^diff --git / { header = 1; next }
            header && /^\+\+\+ / { file = substr($0, 7); sub(/\t$/, "", file); next }
            /^@@ / { header = 0; split($3, start, ","); line = start[1] + 0; next }
            header || !/^\+/ { next }
            {
              text = substr($0, 2)
              if (text ~ /\/home\/[A-Za-z0-9_.-]+\/|\/Users\/[A-Za-z0-9_.-]+\/|[A-Za-z]:[\\\/](Users|home)[\\\/]/ \
                  && text !~ /\/home\/user\//)
                print file ":" line ": " text
              line++
            }')
          if [ -n "$found" ]; then
            echo "$found"
            echo "FAIL: absolute local path added, see «file:line: text» above; write example paths as /…/"
            exit 1
          fi
